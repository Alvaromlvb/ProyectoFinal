# ============================================================================
# Modelos de staging
# ============================================================================
# Debido a que el dataset de tráfico no tiene formato tabular, de forma
# excepcional staging no va a ser 1:1 con bronze: además de castear y testear,
# se extraen la cabecera y el perfil horario de las líneas de texto de cada fichero.
# ============================================================================
version: 2

models:
  - name: __no2_horario
    description: >
      NO2 horario de las tres estaciones de Granada usadas en el análisis (Granada Norte, Palacio
      de Congresos y Ciudad Deportiva), 2015-2021. Una fila por estación, día y hora: las columnas
      H01..H24 de bronze pasan a filas. Las horas siguen en UTC, como en la fuente; el paso
      a hora local se hace en silver. Las horas sin dato válido se conservan con no2_ugm3 nulo.
      Los días que no tienen fila en la fuente no aparecen.
    columns:
      - name: cod_estacion
        description: >
          Código nacional de la estación (provincia INE + municipio INE + estación), p. ej.
          18087007. Clave para cruzar con seed_estaciones.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - '18087007'
                  - '18087010'
                  - '18021001'
          - relationships:
              arguments:
                to: ref('seed_estaciones')
                field: cod_estacion

      - name: punto_muestreo
        description: >
          Serie de datos en el MITECO (estación + magnitud + técnica), p. ej. 18087007_8_8.
        data_tests:
          - not_null

      - name: fecha_utc
        description: Día de la fila en la fuente (día UTC).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "'2015-01-01'::date"
                max_value: "'2021-12-31'::date"

      - name: hora_utc
        description: >
          Hora de la columna de origen, de 1 (H01) a 24 (H24). Es la hora en que termina la
          medición: hora_utc = 1 cubre de 00:00 a 01:00 UTC; hora_utc = 24 termina a las 00:00
          del día siguiente.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 24

      - name: no2_ugm3
        description: >
          Concentración media horaria de NO2 en µg/m3. Nulo si el dato no es válido o no se
          midió: un dato es válido si y solo si no es nulo.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1000

      - name: fichero
        description: Fichero de origen en el stage de bronze, p. ej. NO2_HH_2019.csv.gz.
        data_tests:
          - not_null

      - name: loaded_at
        description: >
          Momento de la carga en bronze. Si un fichero se cargó varias veces, solo se conserva
          la última carga. Lo usa fct_medida_no2 para la carga incremental.
        data_tests:
          - not_null

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - cod_estacion
              - fecha_utc
              - hora_utc

  - name: __trafico
    description: >
      Tráfico del Ayuntamiento de Granada, 2015-2021: una fila por fichero (punto de medida y
      mes), día de la semana y hora. Cada fichero aporta su cabecera (dirección y coordenadas,
      repetidas en todas sus filas) y su perfil horario (líneas 6 a 12, de lunes a domingo, con
      las 24 columnas horarias pasadas a filas). Cada valor es la intensidad media horaria de
      ese día de la semana en el mes, no un día concreto. El año, el mes y el punto fiables salen
      del nombre del fichero (<anno>_<mes>/<pm>.csv). Las comillas de los ficheros de 2020 se
      eliminan. Las coordenadas se dejan como vienen (ED50 o ETRS89 según el periodo); se
      corrigen en silver. Los ficheros incompletos aparecen con una sola fila sin perfil.
    columns:
      - name: fichero
        description: Ruta del fichero en el stage de bronze, p. ej. 2015_01/122.csv.gz.
        data_tests:
          - not_null

      - name: pm
        description: Código del punto de medida, tomado del nombre del fichero.
        data_tests:
          - not_null

      - name: anno
        description: Año, tomado del nombre del fichero.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 2015
                max_value: 2021

      - name: mes
        description: Mes (1-12), tomado del nombre del fichero.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 12

      - name: direccion
        description: >
          Dirección según la línea 2, sin comillas ni el punto o guion bajo final. Nula si la
          cabecera está corrupta. No sirve como clave: el mismo punto aparece escrito de varias
          formas.

      - name: utm_x
        description: Coordenada X (UTM huso 30) según la línea 3. Nula si la cabecera está corrupta.

      - name: utm_y
        description: Coordenada Y (UTM huso 30) según la línea 3. Nula si la cabecera está corrupta.

      - name: n_lineas
        description: Número de líneas del fichero en bronze. Un fichero completo tiene 12.
        data_tests:
          - not_null

      - name: es_fichero_completo
        description: >
          True si el fichero tiene las 12 líneas esperadas. False solo para 2016_10/45, que
          contiene líneas de números sin estructura.
        data_tests:
          - not_null

      - name: es_cabecera_corrupta
        description: >
          True si la línea de dirección o la de coordenadas contiene un volcado de código
          (StringJoin[ o Floor[). El perfil horario de esos ficheros sí es válido.
        data_tests:
          - not_null

      - name: dia_semana
        description: Día de la semana tal como viene en el fichero (lun..dom). Nulo en ficheros incompletos.
        data_tests:
          - not_null:
              config:
                where: es_fichero_completo
          - accepted_values:
              arguments:
                values: ['lun', 'mar', 'mie', 'jue', 'vie', 'sab', 'dom']

      - name: hora
        description: >
          Hora de la columna de origen ("1:00" a "24:00"), de 1 a 24, en hora local. Cada valor
          corresponde a la hora que termina a esa hora (hora = 9 cubre de 8:00 a 9:00), igual
          que en los datos del MITECO.
        data_tests:
          - not_null:
              config:
                where: es_fichero_completo
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 24

      - name: vehiculos_hora
        description: Intensidad media horaria (vehículos/hora) de ese día de la semana y hora en el mes.
        data_tests:
          - not_null:
              config:
                where: es_fichero_completo
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: loaded_at
        description: >
          Momento de la carga del fichero en bronze. Si un fichero se cargó varias veces, solo
          se conserva la última carga. Lo usa fct_medida_trafico para la carga incremental.
        data_tests:
          - not_null

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fichero
              - dia_semana
              - hora
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - pm
              - anno
              - mes
              - dia_semana
              - hora
