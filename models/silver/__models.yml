version: 2

models:

  # ---------------------------------------------------------------------------
  # Dimensiones
  # ---------------------------------------------------------------------------
  - name: dim_tiempo
    description: >
      Año × mes × día de la semana × hora (14.112 filas, 2015-2021). Es el grano temporal
      común del tráfico y del NO2.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['anno', 'mes', 'dia_semana', 'hora']
    columns:
      - name: id_tiempo
        description: Clave subrogada de (anno, mes, número de día de la semana, hora).
        data_tests: [unique, not_null]
      - name: anno
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 2015, max_value: 2021}
      - name: mes
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 12}
      - name: dia_semana
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['lun', 'mar', 'mie', 'jue', 'vie', 'sab', 'dom']
      - name: hora
        description: 1..24, hora local en que termina el intervalo (1 = 00:00-01:00).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 24}
      - name: tipo_dia
        description: laborable (lunes a viernes) o fin_de_semana.
        data_tests:
          - accepted_values:
              arguments:
                values: ['laborable', 'fin_de_semana']
      - name: n_dias
        description: Cuántos días de ese tipo tiene el mes (4 o 5). Denominador de la cobertura del NO2.
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 4, max_value: 5}
      - name: n_festivos
        description: Cuántos de esos días fueron festivo en Granada (el perfil de tráfico los incluye).

  - name: dim_estaciones_no2
    description: Estaciones de calidad del aire de Granada que miden NO2.
    columns:
      - name: id_estacion_no2
        data_tests: [unique, not_null]
      - name: cod_estacion
        data_tests: [unique, not_null]
      - name: nombre
      - name: nombre_municipio
      - name: tipo_estacion
        description: trafico o fondo.
      - name: tipo_area
        description: urbana o suburbana.
      - name: direccion
      - name: latitud
        description: Latitud WGS84 (grados decimales).
        data_tests: [not_null]
      - name: longitud
        description: Longitud WGS84 (grados decimales).
        data_tests: [not_null]
      - name: altitud
        description: Altitud en metros.
      - name: fecha_alta
      - name: punto_muestreo_no2
        description: Serie de NO2 de la estación en el MITECO, p. ej. 18087007_8_8.

  - name: dim_punto_medida_trafico
    description: >
      Puntos de medida de tráfico del Ayuntamiento con su ubicación canónica (cabecera
      fiable más reciente, en latitud/longitud WGS84).
    columns:
      - name: id_punto_medida_trafico
        data_tests: [unique, not_null]
      - name: pm
        description: Código del punto, tomado del nombre del fichero.
        data_tests: [unique, not_null]
      - name: direccion
      - name: latitud
        description: Latitud WGS84 (grados decimales).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 37.05, max_value: 37.30}
      - name: longitud
        description: Longitud WGS84 (grados decimales).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: -3.75, max_value: -3.50}
      - name: primer_mes
        description: Primer mes con fichero del punto.
      - name: ultimo_mes
        description: Último mes con fichero del punto.
      - name: n_meses_con_datos
        description: Meses con fichero completo. Sirve para el filtro de continuidad del 75 %.

  # ---------------------------------------------------------------------------
  # Hechos
  # ---------------------------------------------------------------------------
  - name: fct_medida_trafico
    description: >
      Vehículos por punto, año, mes, día de la semana y hora (perfil mensual del
      Ayuntamiento, festivos incluidos). Incremental: solo procesa los ficheros cargados
      en bronze después del último loaded_at de la tabla.
    columns:
      - name: id_medida_trafico
        data_tests: [unique, not_null]
      - name: id_punto_medida_trafico
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_punto_medida_trafico')
                field: id_punto_medida_trafico
      - name: id_tiempo
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tiempo')
                field: id_tiempo
      - name: num_vehiculos
        description: Vehículos en esa hora (media de los días de ese tipo en el mes).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: loaded_at
        description: Carga en bronze del fichero de origen. Marca de control de la carga incremental.
        data_tests: [not_null]

  - name: fct_medida_no2
    description: >
      NO2 medio por estación, año, mes, día de la semana y hora local, al mismo grano
      que el tráfico. Solo combinaciones con al menos una hora válida. Incremental: recalcula
      completos los meses con datos cargados después del último loaded_at de la tabla y borra
      (post_hook) las combinaciones que se han quedado sin ninguna hora válida.
    columns:
      - name: id_medida_no2
        data_tests: [unique, not_null]
      - name: id_estacion_no2
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_estaciones_no2')
                field: id_estacion_no2
      - name: id_tiempo
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tiempo')
                field: id_tiempo
      - name: no2
        description: Media de NO2 (µg/m³) de las horas válidas.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1000}
      - name: n_horas_validas
        description: >
          Horas válidas que entran en la media. Cobertura = n_horas_validas / dim_tiempo.n_dias.
          Puede valer n_dias + 1 en la hora 3 del último domingo de octubre (cambio de hora).
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 1, max_value: 6}
      - name: loaded_at
        description: Carga en bronze más reciente de las horas de la media. Marca de control de la carga incremental.
        data_tests: [not_null]
